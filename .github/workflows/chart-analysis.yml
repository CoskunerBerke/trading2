# CHART ANALYSIS V1 — gelistirme dalinda ilgili testleri GERCEKTEN calistiran CI (bu dallarda onceki is akisi
# tetiklenmiyordu). Secrets kullanmaz, ag/borsa cagrisi yapmaz, PAPER dosyalarina dokunmaz.
name: chart-analysis

on:
  push:
    branches:
      - work/chart-analysis-v1
      - work/entry-research-v1
      - work/shared-pattern-decisions-v1
    paths:
      - "tradingbot/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/chart-analysis.yml"
  pull_request:
    branches:
      - work/entry-research-v1
      - work/runtime-fixes-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Chart analysis + dashboard + strategy book + pattern + five-findings tests
        run: |
          set +e
          python -m pytest \
            tests/test_chart_analysis_v1.py \
            tests/test_chart_analysis_v1_fixes.py \
            tests/test_chart_patterns_v1.py \
            tests/test_chart_confirmation_parity_v1.py \
            tests/test_chart_confirmation_engine_v1.py \
            tests/test_dashboard.py \
            tests/test_strategy_paper_v1.py \
            tests/test_strategy_paper_dashboard_v1.py \
            tests/test_strategy_paper_engine_v1.py \
            tests/test_strategy_paper_multibook_v1.py \
            tests/test_strategy_paper_universe_v1.py \
            tests/test_strategy_paper_data_source_v1.py \
            tests/test_strategy_paper_price_time_v1.py             tests/test_strategy_paper_held_telemetry_v1.py \
            tests/test_replay_strategy_mode_v1.py \
            tests/test_pattern_trader_v1.py \
            tests/test_dashboard_terminal_v1.py \
            tests/test_accounting.py \
            tests/test_gap_reconcile.py \
            tests/test_replay_funding.py \
            tests/test_trading2_fix_bar_range_v1.py \
            tests/test_trading2_fix_official_filters_v1.py \
            tests/test_trading2_fix_pattern_funding_v1.py \
            tests/test_trading2_fix_plan_expiry_v1.py \
            tests/test_trading2_fix_panel_identity_v1.py \
            tests/test_trading2_fix_contracts_v1.py \
            tests/test_funding_settlement_contract_v2.py \
            tests/test_funding_five_ledgers_v2.py \
            tests/test_funding_off_exit_path_v1.py \
            tests/test_structures_analysis_v1.py \
            tests/test_structures_integrity_v1.py \
            tests/test_structures_strategy_books_v1.py \
            tests/test_structures_main_bot_v1.py \
            tests/test_structures_pattern_bot_v2.py \
            tests/test_structures_panel_v1.py \
            tests/test_structures_verifier_findings_v1.py \
            tests/test_candle_confirmation_parity_v1.py \
            tests/test_box_theory_book_v15.py \
            tests/test_box_theory_v15.py \
            tests/test_engine_v3.py \
            tests/test_runtime_fixes_v1.py \
            tests/test_protective_monitor_v1.py \
            tests/test_measure_protective_monitor_script.py tests/test_bot_scorecard_script.py tests/test_signal_lab.py \
            tests/test_pattern_trader_momentum_v3.py \
            tests/test_learning_provenance_engine.py \
            -q --tb=short > pytest.out 2>&1
          rc=$?
          cat pytest.out
          if [ "$rc" -ne 0 ]; then
            summary=$(tail -n 40 pytest.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failure::${summary}"
          else
            # anonim okumada loglar 403: gecen kosunun sayisi ek aciklama (annotation) olarak da gorunsun
            echo "::notice title=pytest summary::$(tail -n 1 pytest.out | sed 's/%/%25/g')"
          fi
          exit $rc

  measure-script-windows:
    # Ölçüm betiği kullanıcının yerel (Windows) ölçüm ortamında GERÇEKTEN çalışır mı: Win32 bellek ölçümü, Windows yolları,
    # konsol kodlaması (PYTHONUTF8 YOK), atomik yazım. Ağ/Binance çağrısı yapmaz; secrets kullanmaz.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Measurement script tests (Windows)
        run: python -m pytest tests/test_measure_protective_monitor_script.py tests/test_bot_scorecard_script.py tests/test_signal_lab.py -q --tb=short -rs
      - name: index-check + preflight (Windows console)
        shell: pwsh
        run: |
          python scripts/measure_protective_monitor.py index-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\tb src\state" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\tb src\state\futures_ledger.json" -Value "{}"
          Set-Content -Path "$env:RUNNER_TEMP\tbcfg.yaml" -Value "mode: PAPER"
          python scripts/measure_protective_monitor.py preflight --source "$env:RUNNER_TEMP\tb src" --work "$env:RUNNER_TEMP\tb work" --config "$env:RUNNER_TEMP\tbcfg.yaml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
