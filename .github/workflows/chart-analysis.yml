# CHART ANALYSIS V1 — gelistirme dalinda ilgili testleri GERCEKTEN calistiran CI (bu dallarda onceki is akisi
# tetiklenmiyordu). Secrets kullanmaz, ag/borsa cagrisi yapmaz, PAPER dosyalarina dokunmaz.
name: chart-analysis

on:
  push:
    branches:
      - work/chart-analysis-v1
      - work/entry-research-v1
    paths:
      - "tradingbot/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/chart-analysis.yml"
  pull_request:
    branches:
      - work/entry-research-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Chart analysis + dashboard + strategy book + pattern tests
        run: |
          set +e
          python -m pytest \
            tests/test_chart_analysis_v1.py \
            tests/test_chart_analysis_v1_fixes.py \
            tests/test_chart_patterns_v1.py \
            tests/test_chart_confirmation_parity_v1.py \
            tests/test_chart_confirmation_engine_v1.py \
            tests/test_dashboard.py \
            tests/test_strategy_paper_v1.py \
            tests/test_strategy_paper_dashboard_v1.py \
            tests/test_strategy_paper_engine_v1.py \
            tests/test_strategy_paper_multibook_v1.py \
            tests/test_strategy_paper_universe_v1.py \
            tests/test_strategy_paper_data_source_v1.py \
            tests/test_strategy_paper_price_time_v1.py \
            tests/test_replay_strategy_mode_v1.py \
            -q --tb=short > pytest.out 2>&1
          rc=$?
          cat pytest.out
          if [ "$rc" -ne 0 ]; then
            summary=$(tail -n 40 pytest.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failure::${summary}"
          fi
          exit $rc
