# VPS deployment regresyonları — Ubuntu'da sandbox setup + systemd-analyze + preflight matrisi.
# Secrets kullanmaz; yalnız okuma izni; gerçek servis/network trading başlatmaz.
name: deploy-regression

on:
  push:
    branches: [feature/trading-v3-paper-testnet]
    paths:
      - "deploy/**"
      - "tradingbot/ops/**"
      - "tradingbot/cli*.py"
      - "tests/test_deploy_vps.py"
      - ".github/workflows/deploy-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # sandbox testi repo'yu yerelden clone eder; branch ref'leri gerekir
      - name: Materialize branch (sandbox test yerel clone için adlandırılmış branch ister)
        run: git checkout -B "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: ShellCheck (deploy scripts)
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -S warning deploy/setup_vps_v3.sh deploy/preflight.sh
      - name: Deploy regression tests
        run: python -m pytest tests/test_deploy_vps.py -v
