    - ZEC/USDT        # P1+P2+P3
    - SOL/USDT        # P1+P2+P3
    - NEAR/USDT       # P1+P2+P3
    - UNI/USDT        # P1+P2+P3
    - XRP/USDT        # P1+P2+P3
    - ONE/USDT        # P2+P3
    - BNB/USDT        # P1+P2+P3
    - ARB/USDT        # P3
    - DOGE/USDT       # P1+P2+P3
    - LSK/USDT        # P3
    - SUI/USDT        # P3
    - ENA/USDT        # P3
    - G/USDT          # P3
    - WLD/USDT        # P3
    - ADA/USDT        # P1+P2+P3
    - ONDO/USDT       # P3
    - 1000PEPE/USDT   # P3
    - COTI/USDT       # P2+P3
    - LINK/USDT       # P1+P2+P3
    - REZ/USDT        # P3
    - DASH/USDT       # P1+P2+P3
    - AAVE/USDT       # P1+P2+P3
    - TAO/USDT        # P3
    - BCH/USDT        # P1+P2+P3
    - AVAX/USDT       # P1+P2+P3
    - DOT/USDT        # P1+P2+P3
    - FIL/USDT        # P1+P2+P3
    - APT/USDT        # P3
    - SYN/USDT        # P3
    - LTC/USDT        # P1+P2+P3
    - XLM/USDT        # P1+P2+P3
    - INJ/USDT        # P2+P3
    - FET/USDT        # P3
    - TRX/USDT        # P1+P2+P3
    - XMR/USDT        # P1+P2+P3
    - 1000SHIB/USDT   # P2+P3
    - OP/USDT         # P2+P3
    - KSM/USDT        # P1+P2+P3
  allow_long: true
  allow_short: true
  analyze_outside: false        # tur kapsami = evren ∪ acik pozisyonlar
  scanner_feeds_entries: false  # tarama baglam icin surer, GIRIS adayi uretmez

learning_v3:
  enabled: true
  min_samples_train: 40
  holdout_frac: 0.2
  half_life_days: 60
  calibrator: platt
  shadow_trades: true
  # GUVENLIK: otomatik CHAMPION terfisi HICBIR modda yapilmaz. true verilirse config
  # PAPER_AUTO_PROMOTION_FORBIDDEN ile fail-closed reddedilir (bkz. config_v3.validate_v3).
  auto_promote_in_paper: false  # terfi her zaman acik manuel operator onayiyla

storage:
  sqlite_enabled: true
  db_filename: tradingbot.db
  parquet_dir: candles
  backups_dir: backups
  keep_hourly: 24
  keep_daily: 7
  keep_weekly: 4

obsidian_v3:
  coin_heads_enabled: true
  prune_stale_hours: 48
  signals_retention_days: 30
  signals_max_files: 200

dashboard:
  enabled: true
  host: 127.0.0.1              # public bind için auth token env + HTTPS/tünel zorunlu
  port: 8080
  auth_token_env: TRADINGBOT_DASHBOARD_TOKEN
  allow_insecure_public: false
  max_bars: 600

monitoring:
  json_logs: true
  log_dir: logs
  heartbeat_stale_s: 2400
  telegram_enabled: false
  discord_enabled: false

security:
  live_confirmation_required: true
  redact_logs: true

# ---- MUM ONAYI (V4, 2026-09-12) --------------------------------------------------------
# Operatör kararı: klasik mum formasyonları giriş karar yolunda AKTİF. Seçili varyant karşı
# formasyon vetosu: son KAPANMIŞ 4h barda adayın yönüne KARŞI şekil varsa giriş açılmaz.
# Diğer üç varyant (c1_4h, c2_4h_confirm, c4_1d) her adayda gölge olarak karar kaydına yazılır.
# Ölçüm: research/entry_v1/out/DENEY_V4.md — hiçbir varyant iki pencerede doğrulanmadı.
# ENFORCE yalnız PAPER/TESTNET'te açılabilir; LIVE modda config reddedilir.
entry_selectivity:
  candle_confirmation_mode: ENFORCE          # OFF | SHADOW | ENFORCE
  candle_confirmation_variant: c3_4h_veto    # c1_4h | c2_4h_confirm | c3_4h_veto | c4_1d
  # GRAFİK FORMASYONU ONAYI (V5): çift dip/tepe, üçlü, OBO, üçgen, bayrak; yalnız KIRILIŞLA teyitli.
  # Önce SHADOW: her adayda dört varyantın hükmü ve taze formasyon listesi kaydedilir, karar değişmez.
  # Ölçüm: research/entry_v1/out/DENEY_V5.md. ENFORCE açmak operatör kararıdır.
  chart_confirmation_mode: SHADOW            # OFF | SHADOW | ENFORCE
  chart_confirmation_variant: p2_4h_veto     # p1_4h_confirm | p2_4h_veto | p3_1d_confirm | p4_1d_veto
  # PİYASA REJİMİ KAPISI (V7, 2026-09-13): BTC günlük close > EMA200 ise UP. Seçili varyant r1: yalnız
  # LONG ve yalnız UP rejiminde giriş; SHORT hiç açılmaz. Ölçüm: research/entry_v1/out/DENEY_V7.md —
  # üç pencerede de temeli geçti (işlem başına +0,19R / +0,15R / +0,09R, düşüş yarıya indi) ama 2022
  # sonrası hâlâ negatif: KAYIP AZALTICI, doğrulanmış kârlı kural değil. Operatör kararıyla ENFORCE.
  regime_gate_mode: ENFORCE                  # OFF | SHADOW | ENFORCE
  regime_gate_variant: r1_long_only_uptrend  # r1_long_only_uptrend | r2_no_trade_downtrend | r3_follow_regime

# ---- TEK KURALLI TREND STRATEJİSİ — KÂĞIT İLERİ TEST (V10, 2026-09-13) ----------------------
# Ana botun YANINDA, AYRI 100 USDT sanal defter. Kural: BTC 1d close > EMA200 iken, 1d close > EMA200
# olan coinde LONG (piyasa); close < EMA200 → kapat; felaket stopu close − 3×ATR14(1d); kaldıraç 1.
# Ölçüm: research/entry_v1/out/DENEY_V9.md (T2 +107% / +34% / +10%, maksDD %22). Gerçek para YOK;
# LIVE modda config reddedilir. Ana botun defteri/öğrenicisi/kararları etkilenmez.
strategy_paper:
  enabled: true
  name: t2_trend_regime
  # BAKIYE 200 (2026-09-21, kullanici karari + OLCUM): 100 USDT'de pozisyonlar borsa
  # minimumlarina takiliyordu. Olculdu (40 coin, 6 pencere): MIN_ORDER_CONFLICT 587 -> 0,
  # MIN_NOTIONAL 593 -> 238. Denenen butun ayarlar icinde GERCEKTEN bir kisiti acan tek sey.
  starting_equity_usdt: 200
  atr_mult: 3.0
  breakeven_at_mfe_r: 0.0
  state_dir: strategy_paper
  rule_params:
    # IHTIYAC KADAR KALDIRAC (2026-09-21, kullanici talimati: "1x sakin olmasin").
    # `leverage` TABAN, `leverage_max` TAVAN. Uygulayici kaldiraci ancak islemin notional'i
    # tek pozisyon tavanina (equity x %30 x kaldirac) sigmiyorsa ve ANCAK gerektigi kadar
    # yukseltir. Stopu dar olan islem ayni hareketten daha cok R uretir ve tam da tavana
    # takilan odur. Kaldirac islem basina RISKI ARTIRMAZ (risk stop mesafesiyle belirlenir);
    # likidasyonu yaklastirir, bu yuzden gerekmedikce yukseltilmez.
    # Olculdu (620 kapanis): L2'de mesru likidasyon 0/620 (stop maks %39,7 < likidasyon %49,80),
    # L3'te 9, L5'te 54 -> tavan 4 secildi.
    leverage: 2
    leverage_max: 4
  # GIRIS KAYMASI KAPISI: 0 = KAPALI. Mekanizma yazildi ve testli ama esik degeri HENUZ
  # OLCULMEDI; olculmeden acilmaz (bkz. apply_action GIRIS KAYMASI KAPISI).
  max_entry_drift_pct: 0.0
  # V12 (DENEY_V11): ikinci defter — 28 günlük zaman serisi momentumu (m2), T2 ile yan yana ileri test.
  extra:
    - name: m2_tsmom28
      starting_equity_usdt: 200          # bkz. ana defterdeki BAKIYE 200 gerekcesi
      atr_mult: 3.0
      breakeven_at_mfe_r: 0.0
      state_dir: strategy_paper_m2
      rule_params:
        leverage: 2                      # bkz. ana defterdeki IHTIYAC KADAR KALDIRAC gerekcesi
        leverage_max: 4
      max_entry_drift_pct: 0.0
    # V15 (BOX THEORY): üçüncü defter — önceki günün aralığını 5m'de soluklayan gün içi kural.
    # Kuralın giriş/stop tanımı videodan BİREBİR; çıkış videoda YOKTUR → `exit_kind` bir SEÇİMDİR ve
    # burada araştırma süpürmesinin sonucu yazılır. Süpürme bitene kadar defter KAPALI kalır:
    # ölçülmemiş bir çıkışla canlı ileri test başlatmak, sonucu yorumlanamaz kılar.
    # OLCUM SONUCU (DENEY_V15, 10 coin, 3 pencere, 42 kol, ~1,1M tetik):
    #   HICBIR kol karar kuralini gecmedi. En iyi konfigurasyonda bile net beklenti
    #   P1 -0,0805R / P2 +0,0050R / P3 -0,0785R. Brut (maliyetsiz) sinyal de sifir civarinda,
    #   yani acik maliyet degil; altinda tasiyacak avantaj YOK.
    # DEFTER YINE DE ACIK: bu bir ILERI TEST defteridir, kar beklentisi DEGIL. Amaci canli
    #   davranisin backtest'le tutup tutmadigini olcmek ve paneli beslemek. PAPER, gercek para YOK.
    #   Kapatmak tek satirdir: enabled: false.
    - name: b1_box_fade
      enabled: true
      starting_equity_usdt: 200          # bkz. T2 defterindeki BAKIYE 200 gerekcesi
      breakeven_at_mfe_r: 0.0
      state_dir: strategy_paper_box
      rule_params:
        near_frac: 0.10          # kenar bandı = kutu yüksekliğinin %10'u
        trigger: break_prev      # kırmızı/yeşil mum ÖNCEKİ mumun ucunu kırmalı
        long_stop: day_low       # video birebir (simetrik okuma: prev_candle)
        # SECIM KURALI: hicbir kol pozitif olmadigi icin "kazanan" yok; EN KOTU PENCERESI EN IYI
        # olan kol secildi (box_mid: -0,0805R). Bu bir kar iddiasi degil, en az kotu olanin adidir.
        exit_kind: box_mid
        exit_r: 2.0
        # ZORUNLU ESIK: uretim tek-coin tavani, stop >= risk%/(%30 x kaldirac) = %2,22 istiyor.
        # Bu esik OLMADAN defter her sinyali MAX_POSITION_PCT ile reddeder ve SESSIZCE OLU kalir
        # (olculdu: 143/143 ret). Esikle islemlerin %99,5'i boyutlandirilabiliyor.
        min_stop_pct: 2.22
        eod_close: true
        allow_long: true
        allow_short: true
        # KALDIRAC ARITMETIGI (olculdu, varsayilmadi): tek coin tavani
        #   notional <= ozkaynak * max_position_pct/100 * max(kaldirac,1)
        # 5m stopu dar oldugu icin notional = risk% / stop% buyuk cikar. risk %2, tavan %30, stop %2,8 ->
        # notional ozkaynagin %71'i -> kaldirac 1'de MAX_POSITION_PCT ile REDDEDILIR. Gereken: L >= 2,38.
        # Kaldirac burada RISKI ARTIRMAZ (islem basina risk yine %2, stop mesafesiyle belirlenir); yalnizca
        # gunluk-stop icin tasarlanmis notional tavanini gun ici stopla uyumlu hale getirir.
        leverage: 3
        # IHTIYAC KADAR KALDIRAC TAVANI (2026-09-21): yukaridaki aritmetik kaldiraci SABIT 3
        # tutuyordu. Tavan, uygulayicinin kaldiraci ANCAK GEREKTIGI KADAR (ve en fazla 4)
        # yukseltmesine izin verir; genis stoplu islemler 3 ile kalir, gereksiz likidasyon
        # yakinligi olusmaz.
        leverage_max: 4

