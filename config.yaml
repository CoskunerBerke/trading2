# ============================================================
#  Trading Bot — ana yapılandırma
#  Bu bot ANALİZ + KARAR + SİNYAL üretir ve Binance kurallarıyla KAĞIT (paper) portföy tutar.
#  Gerçek emir GÖNDERMEZ. Tetik insanda kalır.
# ============================================================

exchange:
  source: tradingview       # tradingview (birincil: TradingView veri akışından BINANCE:XXX mumları) | ccxt
  tv_exchange: BINANCE      # TradingView'de hangi borsanın mumları (BINANCE:BTCUSDT)
  candidates: [binance, bybit, okx, kucoin]   # ccxt yedek zinciri (TradingView düşerse)
  rules_exchange: binance   # emir kuralları (min tutar, adım) hangi borsadan
  timeframe: "4h"
  history_days: 730
  cache_dir: "data"

# ANALIZ kapsami (V16: 10 -> 40). GIRIS evreni ayri bolumdedir (`entry_universe`) ve AYNI listedir.
# SECIM OLCUTLERI (2026-09-18 taze universe.json, sonuclara BAKILMADAN yazildi):
#   1) Binance USDT perpetual (market_type futures|both), borsa filtreleri DOGRULANMIS
#   2) listeleme yasi >= 747 gun — en az BIR tam olcum penceresi (P3) kapansin
#   3) spread <= %0,06 — kayma varsayimimiz 3 bps; bunun cok ustu olcumu bozar
#   4) ASCII sembol — dogrulanmamis/okunamayan sembol alinmaz
#   5) 24s hacme gore ilk 40; mevcut on coinin HEPSI listede kaldi (olcum surekliligi)
# PENCERE KAPSAMI — backtest TEK sayi olarak sunulmaz, pencere basina coin sayisi yazilir:
#   P1 (2020-11->) 22 coin · P2 (2022-09->) 27 coin · P3 (2024-09->) 40 coin
# Elenenler ornegi: HYPE/AVA/PUMP/TRUMP/PAXG (yas), DRIFT (spread %0,125), 龙虾 (ASCII disi).
coins:
  - BTC/USDT
  - ETH/USDT
  - ZEC/USDT
  - SOL/USDT
  - NEAR/USDT
  - UNI/USDT
  - XRP/USDT
  - ONE/USDT
  - BNB/USDT
  - ARB/USDT
  - DOGE/USDT
  - LSK/USDT
  - SUI/USDT
  - ENA/USDT
  - G/USDT
  - WLD/USDT
  - ADA/USDT
  - ONDO/USDT
  - 1000PEPE/USDT
  - COTI/USDT
  - LINK/USDT
  - REZ/USDT
  - DASH/USDT
  - AAVE/USDT
  - TAO/USDT
  - BCH/USDT
  - AVAX/USDT
  - DOT/USDT
  - FIL/USDT
  - APT/USDT
  - SYN/USDT
  - LTC/USDT
  - XLM/USDT
  - INJ/USDT
  - FET/USDT
  - TRX/USDT
  - XMR/USDT
  - 1000SHIB/USDT
  - OP/USDT
  - KSM/USDT

backtest:
  fee_pct: 0.10             # Binance spot taker (%)
  slippage_pct: 0.05
  train_ratio: 0.70         # bilgi amaçlı tek bölme (son %30)
  min_trades: 15            # tüm veride min işlem (sıralamaya girmek için)
  # --- walk-forward optimizasyon ---
  wfo_folds: 4              # ileriye dönük test adımı sayısı
  wfo_initial_train_ratio: 0.45   # ilk eğitim penceresi (veri oranı); kalan kısım 4 adıma bölünür
  min_oos_sharpe: 0.30      # birleşik WFO OOS Sharpe eşiği
  min_oos_profit_factor: 1.10
  min_oos_trades: 8

risk:
  starting_equity_usdt: 100     # PAPER katkı sermayesi (2026-08-26: 50→100; mevcut defter dosyaları kendi tabanını taşır)
  risk_per_trade_pct: 2.0       # işlem başına risk (%) — küçük hesap için 2
  atr_stop_mult: 2.5
  max_position_pct: 30          # tek coine max sermaye (%) → 15 USDT
  max_open_positions: 3
  btc_regime_filter: true
  min_confidence_to_buy: 55

# TARAYICI — sabit giriş evreni açıkken KAPALI (2026-09-11).
# Neden: tarayıcı sembol başına İKİ REST isteği yapar (4h + 1d mumları). 160 sembolde
# tarama başına 320 istek, 15 dk kadans + `--scan-every 2` ile günde ~15.360 istek eder.
# `entry_universe.scanner_feeds_entries: false` olduğu için bu isteklerin ürünü artık
# hiçbir girişe dönüşmez; yalnız panelin tarayıcı sayfasını besler.
# Geri açmak tek satırdır: `enabled: true`. O zaman `state/universe_eval.json` yeniden
# tazelenir ve tarama adayları panelde görünür (giriş yine yalnız evrende açılır).
scanner:
  enabled: false
  min_volume_usdt: 20000000     # 24s hacim ≥ 20M USDT olan Binance USDT perpetual'ları tara
  flag_score: 60                # işaretleme eşiği (0-100)
  top_n: 12                     # derin ajan analizine giden setup sayısı
  max_symbols: 160              # tur başına en fazla taranan sembol (hacme göre ilk N)
  core_coins: [BTC/USDT, ETH/USDT, SOL/USDT]   # her turda mutlaka analiz edilenler

futures:
  enabled: true                 # yönetici planlarını kağıt futures defterinde simüle et
  starting_equity_usdt: 100     # PAPER katkı sermayesi (2026-08-26: 50→100; risk oranları AYNI, %6 bütçe tabana ölçeklenir)
  max_positions: 3
  min_pwin: 0.45                # öğrenen model hazırsa: P(kazanç) bunun altındaysa işlem açma

learning:
  min_trades: 20                # bu kadar kapanmış işlemden sonra öğrenilen ağırlıklar/filtreler devreye girer

obsidian:
  vault_path: "C:/Users/berke/Trading bot/Trading_bot"   # Obsidian'da açtığın kasa
  folder: ""
  canvas_name: "Trading Bot Şeması.canvas"
  git_sync: false              # true: her turdan sonra kasa klasörünü git commit+push et (bulutta çalışırken PC/telefon Obsidian Git ile çeker)

state_dir: "state"

# ============================================================
#  v3 bölümleri (geriye uyumlu; eksik anahtarlar güvenli varsayılana düşer, riskle ilgili hatalı değerlerde program BAŞLAMAZ)
# ============================================================
app:
  name: trading2
  version: "3.0"
  timezone_display: Europe/Istanbul

mode:
  mode: PAPER                  # OBSERVE | PAPER | TESTNET | SHADOW_LIVE (LIVE_LIMITED/LIVE bu sürümde kapalı). Geçişler yalnız `mode-transition` ile, manuel.
  live_trading: false          # ALLOW_LIVE_TRADING env + typed token olmadan hiçbir zaman gerçek emir yok
  withdrawals: false           # desteklenmiyor
  account_label: default

markets:
  spot_enabled: true
  futures_enabled: true
  quote_assets: [USDT]
  allow_usdc: false

universe:                      # dinamik Binance spot + USDⓈ-M perpetual evreni (python -m tradingbot universe)
  min_quote_volume_24h: 20000000
  max_spread_pct: 0.2
  min_depth_0_5pct_usdt: 50000
  min_listing_age_days: 60
  max_symbols: 200
  refresh_minutes: 360
  # KANIT ONARIMI V1.1 (2026-09-09): yalniz-vadeli (spot'ta listesiz) kesit 87 kurulumda -0.24R, spot kripto LONG +0.155R.
  # Yasak DEGIL: olculen ~0.37R acik yumusak ceza olarak dusulur; aday degerlendirilir, zayifsa arastirma boyutunda acilir.
  futures_only_penalty_r: 0.35
  spot_listing_ttl_minutes: 1440
  tier2_top: 30
  tier3_top: 10

data:
  primary: binance             # Binance resmi market-data endpointleri; TradingView/ccxt yedek + karşılaştırma
  fallback: [tradingview, ccxt]
  max_candle_age_bars: 2
  max_ticker_age_s: 120
  max_clock_drift_ms: 5000
  max_price_divergence_pct: 0.5
  rate_budget_safety: 0.7

# ============================================================
#  TARIHSEL ARSIV + BENZERLIK INDEKSI — OTOMATIK ARTIMLI YENILEME (2026-09-11)
#  Worker arka planda yalnizca YENI KAPANMIS barlari ceker ve indeksi yeniden kurup
#  ATOMIK yayimlar. Tur bu ise blok OLMAZ, dolayisiyla stop/TP yonetimi gecikmez.
#  Butun gecmis her seferinde indirilmez: baslangic manifestteki son bardir.
#  Ilk kapsama AYRI bir istir: `python -m tradingbot history-collect ...` (bir kez).
# ============================================================
history:
  enabled: true
  auto_refresh: true
  refresh_minutes: 15           # arka plan periyodu
  refresh_timeframes: [4h, 1h, 1d]   # '4h' zorunlu: pattern indeksi bu seriden kurulur
  refresh_max_requests: 24      # tur basina istek tavani (rate-limit korumasi)
  refresh_max_symbols: 16       # BELLEK TAVANI: yeniden kurulumda eski+yeni indeks birlikte yasar

coin_heads:
  enabled: true                # false → eski (v2) motor
  consensus_threshold: 0.22
  min_confidence: 0.25
  min_expected_r: 1.5          # maliyet SONRASI beklenen R
  max_workers: 4
  decision_ttl_minutes: 240
  funding_horizon_bars: 12

llm:
  provider: noop               # noop | anthropic (ANTHROPIC_API_KEY env; anahtar asla config/log/Obsidian'a yazılmaz)
  mode: POSTMORTEM_ONLY        # OFF | POSTMORTEM_ONLY | ADVISORY | VETO_ONLY | RESEARCH_COUNCIL — LLM asla emir açamaz
  model_cheap: claude-haiku-4-5-20251001
  model_strong: claude-opus-5
  daily_usd_budget: 2.0
  daily_token_budget: 400000
  per_tour_candidates: 3
  max_output_tokens: 1200

futures_v3:
  margin_mode: isolated
  leverage_default: 1
  leverage_max_paper_research: 2
  tp1_fraction: 0.5
  ambiguity_policy: worst_case # aynı tikte stop+hedef → stop
  liq_fee_pct: 0.5
  # KANIT ONARIMI V1.1 (2026-09-09): SHORT kesiti LONG'a gore ~0.6R geride (n=13, ince). Yasak DEGIL: yumusak ceza,
  # kucuk orneklem icin 0.50R'ye cekildi; net beklentisi pozitif SHORT en kotu arastirma boyutunda acilir.
  short_penalty_r: 0.50
  # MFE +1.0R'ye ulasinca stop gercek basa-basa tasinir (TP1 beklenmez). 12 acik pozisyonun 9'unda stop hic tasinmamisti.
  breakeven_at_mfe_r: 1.0
  # FUNDING (2026-09-22): beş futures defteri GERÇEKLEŞMİŞ settlement oranı + settlement mark'ı ile tahakkuk eder
  # (funding_settlement_v2). Anlık `funding_pct` geçmiş settlement'lara artık UYGULANMAZ; bilinmeyen dönem bekler.
  realized_funding_source: true

execution:
  gateway: paper               # paper | binance_spot_testnet | binance_futures_testnet (testnet_enabled + env anahtarları gerekir); live KAPALI
  testnet_enabled: false
  reconcile_on_start: true
  # YÜRÜTME HASSASİYETİ (bkz. tradingbot/execspec.py, deploy/config.paper-precision.example.yaml)
  # true: DOĞRULANMIŞ fiyat/miktar adımı olmayan sembolde YENİ GİRİŞ açılmaz (UNRESOLVED_PRECISION).
  # Açık pozisyonların koruyucu çıkışları ETKİLENMEZ (`tick()` kural çözümü çağırmaz).
  # Ölçüm 2026-09-08: varsayılan 0.01 tick TRX'te plan geometrisini 2.0000R → 1.2775R'ye düşürüyordu;
  # resmi USDⓈ-M kuralıyla (tick 0.00001) aynı kayma altında 1.9270R. 11/11 açık pozisyon ve
  # 40/40 güncel aday resmi kurala çözülüyor, yani bu bayrak hiçbir mevcut adayı engellemiyor.
  require_verified_precision: true
  filters_max_age_hours: 24    # symbol_filters.json bundan eskiyse tur başında exchangeInfo (ağırlık 1)
  filters_refresh_on_start: true

fees:                          # PAPER'da versiyonlu tarife; API bağlanınca gerçek hesap komisyonu alınabilir (FeeSource)
  spot_maker_pct: 0.10
  spot_taker_pct: 0.10
  futures_maker_pct: 0.02
  futures_taker_pct: 0.05
  slippage_bps: 3.0
  bnb_discount: false
  source: config

tax_policy:                    # Vergi ≠ borsa komisyonu. Doğrulanmamış oran uydurulmaz: varsayılan kesinti 0.
  enabled: false
  status: UNVERIFIED_OR_NOT_EFFECTIVE
  jurisdiction: TR
  accounting_method: FIFO
  source_url: https://www.tbmm.gov.tr/Haber/Detay?Id=24224a43-2062-4397-8761-019d2b9e0bd5
  source_checked_at: "2026-03-26"
  manually_confirmed: false

risk_profiles:
  profile: PAPER_RESEARCH      # PAPER_RESEARCH (mevcut %2 davranışı AYNEN) | TESTNET | SHADOW_LIVE | LIVE_LIMITED
  overrides: {}                # ör. {daily_loss_stop_pct: 2.0, max_drawdown_kill_pct: 8.0}
  i_understand: false

# Dinamik futures kaldıracı — YALNIZ PAPER. Bu dosyada TEK `leverage:` bölümü olmalıdır
# (yinelenen anahtar `load_config` içinde fail-closed reddedilir).
# KALDIRAÇ RİSKİ ARTIRMAZ: notional risk bütçesi + stop mesafesinden gelir; kaldıraç yalnızca
# `initial_margin = notional / leverage` değerini belirler. Stopta beklenen azami USDT zararı
# 2x–5x arasında AYNIDIR. Zayıf aday `min_leverage` ile AÇILMAZ → NO_TRADE.
leverage:
  enabled: true                # PAPER araştırma profilinde açık
  paper_only: true             # LIVE/TESTNET'te açılamaz; `mode != PAPER` iken config FAIL verir
  min_leverage: 2              # 1x yeni futures girişi YASAK (min < 2 → ConfigError)
  max_leverage: 5              # MUTLAK üst sınır (max > 5 → ConfigError)

# ============================================================
#  SABIT GIRIS EVRENI (2026-09-11)
#  Yeni USDⓈ-M perpetual girisi YALNIZ bu listede acilir. Liste disindaki ACIK
#  pozisyonlarin fiyat takibi, stop/TP yonetimi ve kapanisi AYNEN surer — liste
#  degisti diye pozisyon KAPATILMAZ (bkz. tradingbot/entry_universe.py).
#  Sozlesme kimlikleri Binance USDⓈ-M exchangeInfo'dan dogrulandi (2026-09-11):
#  hepsi status=TRADING, contractType=PERPETUAL, quote=USDT.
#  enabled=true iken bos liste ConfigError'dur (fail-closed).
# ============================================================
entry_universe:
